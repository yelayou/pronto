name: Deploy staging

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    name: Full tests + deploy staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      TWILIO_ACCOUNT_SID: ${{ secrets.STAGING_TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.STAGING_TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_NUMBER: ${{ secrets.STAGING_TWILIO_WHATSAPP_NUMBER }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISPATCHER_PHONE: ${{ secrets.DISPATCHER_PHONE }}
      ETRANSFER_LINK: ${{ secrets.ETRANSFER_LINK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + typecheck
        run: npm run lint && npm run typecheck

      - name: Unit + integration tests
        run: npm run test -- --reporter=verbose

      - name: Deploy to staging
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "deploy-url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Smoke test staging
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: STAGING_URL=${{ steps.deploy.outputs.deploy-url }} npm run smoke

      - name: Notify on failure
        if: failure()
        run: echo "Staging deploy failed — check Actions tab"
