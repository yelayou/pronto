name: Branch name check

on:
  pull_request:
    branches: [main]

jobs:
  branch-name:
    name: Validate branch naming convention
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'dependabot/')"
    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch name: $BRANCH"

          if [[ "$BRANCH" =~ ^(feature|fix|hotfix|ci|chore|release|docs|refactor|test)/.+ ]]; then
            echo "✅ Branch name is valid: $BRANCH"
          else
            echo "❌ Invalid branch name: '$BRANCH'"
            echo ""
            echo "Branch names must follow the convention:"
            echo "  feature/<description>   e.g. feature/dispatcher-handler"
            echo "  fix/<description>       e.g. fix/fare-rounding"
            echo "  hotfix/<description>    e.g. hotfix/payment-crash"
            echo "  ci/<description>        e.g. ci/manual-preview-workflow"
            echo "  chore/<description>     e.g. chore/bump-dependencies"
            echo "  release/<version>       e.g. release/1.2.0"
            echo "  docs/<description>      e.g. docs/api-reference"
            echo "  refactor/<description>  e.g. refactor/fare-calculator"
            echo "  test/<description>      e.g. test/webhook-integration"
            exit 1
          fi
