<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" role="img" aria-label="Pronto steering wheel">
  <g fill="none" stroke="#2F7D46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rim -->
    <circle cx="32" cy="32" r="24" />
    <!-- Hub -->
    <circle cx="32" cy="32" r="6" fill="#2F7D46" />
    <!-- Spokes: horizontal + lower vertical (classic 3-spoke wheel) -->
    <line x1="14" y1="32" x2="26" y2="32" />
    <line x1="38" y1="32" x2="50" y2="32" />
    <line x1="32" y1="38" x2="32" y2="50" />
  </g>
</svg>
